services:
  neverbot:
    build:
      context: .
    image: neverbot:${NEVERBOT_IMAGE_TAG:-5.4.0}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3500}
      MONGO_URI: "mongodb://${LOCAL_MONGO_ROOT_USERNAME:-neverbot}:${LOCAL_MONGO_ROOT_PASSWORD:?Set LOCAL_MONGO_ROOT_PASSWORD in .env or shell}@mongo:27017/${MONGO_DB_NAME:-neverbot}?authSource=admin"
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-3500}:${PORT:-3500}"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 3500) + '/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mongo:
    image: mongo:8.3.1
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${LOCAL_MONGO_ROOT_USERNAME:-neverbot}
      MONGO_INITDB_ROOT_PASSWORD: ${LOCAL_MONGO_ROOT_PASSWORD:?Set LOCAL_MONGO_ROOT_PASSWORD in .env or shell}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-neverbot}
    volumes:
      - neverbot-mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 }).ok\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  neverbot-mongo-data:
